<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2f4a" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="620" fill="url(#bg)"/>
  <rect width="1000" height="620" fill="url(#grid)"/>
  <rect x="24" y="24" width="952" height="572" fill="none" stroke="#345182" stroke-width="2" rx="6"/>

  <!-- storage racks: 4 blocks of 3 rows, aisles between -->
  <g fill="#16324f" stroke="#4f83c2" stroke-width="2">
    <rect x="90" y="110" width="360" height="40" rx="3"/>
    <rect x="90" y="170" width="360" height="40" rx="3"/>
    <rect x="90" y="230" width="360" height="40" rx="3"/>
    <rect x="550" y="110" width="360" height="40" rx="3"/>
    <rect x="550" y="170" width="360" height="40" rx="3"/>
    <rect x="550" y="230" width="360" height="40" rx="3"/>
    <rect x="90" y="360" width="360" height="40" rx="3"/>
    <rect x="90" y="420" width="360" height="40" rx="3"/>
    <rect x="90" y="480" width="360" height="40" rx="3"/>
    <rect x="550" y="360" width="360" height="40" rx="3"/>
    <rect x="550" y="420" width="360" height="40" rx="3"/>
    <rect x="550" y="480" width="360" height="40" rx="3"/>
  </g>

  <!-- rack bay dividers -->
  <g stroke="#0d1526" stroke-width="2">
    <line x1="150" y1="110" x2="150" y2="270"/><line x1="210" y1="110" x2="210" y2="270"/>
    <line x1="270" y1="110" x2="270" y2="270"/><line x1="330" y1="110" x2="330" y2="270"/>
    <line x1="390" y1="110" x2="390" y2="270"/>
    <line x1="610" y1="110" x2="610" y2="270"/><line x1="670" y1="110" x2="670" y2="270"/>
    <line x1="730" y1="110" x2="730" y2="270"/><line x1="790" y1="110" x2="790" y2="270"/>
    <line x1="850" y1="110" x2="850" y2="270"/>
  </g>

  <!-- central aisle -->
  <rect x="470" y="90" width="60" height="450" fill="#0f2136" stroke="#2f4c74" stroke-width="1"/>
  <line x1="500" y1="90" x2="500" y2="540" stroke="#4f83c2" stroke-width="2" stroke-dasharray="12 10"/>

  <text x="270" y="300" fill="#8fb8e6" font-size="14" text-anchor="middle">货架区 A</text>
  <text x="730" y="300" fill="#8fb8e6" font-size="14" text-anchor="middle">货架区 B</text>
  <text x="270" y="552" fill="#8fb8e6" font-size="14" text-anchor="middle">货架区 C</text>
  <text x="730" y="552" fill="#8fb8e6" font-size="14" text-anchor="middle">货架区 D</text>

  <text x="48" y="60" fill="#cfe0f5" font-size="22" font-weight="600">一号仓储区 · Warehouse A</text>
  <text x="48" y="84" fill="#5f7ba3" font-size="13">占位场景底图 · 1000 × 620 · resolution 0.12 m/px</text>
</svg>
