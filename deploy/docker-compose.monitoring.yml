# Monitoring overlay: Prometheus + Alertmanager + Grafana with provisioned
# datasources, dashboard and alert rules. Use alongside the base file:
#
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.monitoring.yml up -d
#
# An overlay rather than a compose `profiles:` entry, even though the roadmap
# said profile: compose interpolates the *whole* file before profiles are
# applied, so a required `GRAFANA_ADMIN_PASSWORD` on a profiled service breaks
# `up` for everyone who never asked for monitoring. Same opt-in, and the failure
# only lands on the deployment that opted in.
services:
  backend:
    networks:
      # Merged with the base list, so the backend can be scraped without giving
      # Prometheus any route to mongo or mosquitto.
      - monitoring

  prometheus:
    image: prom/prometheus:v3.1.0
    # Scrapes backend:3000/metrics from inside the network, which is exactly why
    # the edge nginx does not route /metrics at all.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    networks:
      - monitoring
    ports:
      # Loopback only: the query API is unauthenticated.
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  # Where the 13 rules in prometheus/alerts.yml go. Before this service existed
  # they went nowhere: Prometheus had no `alerting:` block, so every rule
  # evaluated, fired, and was seen by no one while the docs described them as
  # notifications. The shipped receiver is deliberately empty — see
  # alertmanager/alertmanager.yml for what that means and how to attach email or
  # a webhook.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Needed for silences and the UI to build correct links to itself.
      - --web.external-url=http://127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}
    networks:
      - monitoring
    ports:
      # Loopback only, like Prometheus: the API is unauthenticated and it can
      # create silences, i.e. it can switch alerting off.
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Silences and the notification log live here. Without a volume, every
      # restart resurrects the alerts an operator had deliberately silenced.
      - alertmanager-data:/alertmanager
    healthcheck:
      test:
        ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    depends_on:
      - prometheus
    environment:
      # No anonymous access and no admin/admin: the password must be supplied,
      # the same rule the broker credentials follow.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required by the monitoring overlay}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    networks:
      - monitoring
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  # ── Container-side exporters ────────────────────────────────────────────
  # Prometheus already scrapes the backend (its own metrics). These three answer
  # the blind spots the app cannot report on itself — the datastore, the broker
  # and the edge proxy. Each joins the segment it needs to reach plus `monitoring`
  # so Prometheus can scrape it; none is published to the host. They carry no
  # healthcheck on purpose: `up{job=...}` in Prometheus is the liveness signal
  # (see prometheus.yml), and guessing whether each third-party image ships wget
  # for a container healthcheck would only add a flakier second answer.

  mongodb-exporter:
    image: percona/mongodb_exporter:0.44.0
    # URI (with the root credential) via env, not a --mongodb.uri flag, so the
    # password stays out of the command baked into `docker inspect` — same posture
    # as the backend's MONGO_URI and the mongo healthcheck's $$-expansion.
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongo:27017/admin?authSource=admin
    command:
      - --collect-all
      - --compatible-mode
    networks:
      - data # reach mongo (the internal segment)
      - monitoring # be scraped by Prometheus
    depends_on:
      - mongo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  # Reads the broker's $SYS/# tree. It needs a broker account that can *read* that
  # subtree, which neither the backend (reads /fleet/#) nor a publisher (writes it)
  # is allowed — so the base entrypoint adds a read-only monitor user, but only
  # when MQTT_MONITOR_* are set (i.e. only under this overlay); without them the
  # broker is byte-for-byte unchanged.
  mosquitto-exporter:
    image: sapcc/mosquitto-exporter:0.8.0
    command:
      - --endpoint=tcp://mosquitto:1883
    environment:
      MQTT_USER: ${MQTT_MONITOR_USERNAME:-navfleet-monitor}
      MQTT_PASS: ${MQTT_MONITOR_PASSWORD:?MQTT_MONITOR_PASSWORD is required by the monitoring overlay (the broker no longer allows anonymous clients)}
    networks:
      - bus # reach the broker
      - monitoring # be scraped
    depends_on:
      - mosquitto
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  # Scrapes nginx's stub_status. That endpoint is served by stub-status.conf on an
  # internal 8081 listener mounted below — not the edge port, so connection counts
  # are never exposed to the host.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    networks:
      - edge # reach nginx
      - monitoring # be scraped
    depends_on:
      - nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    restart: unless-stopped

  # nginx itself: unchanged except for a read-only stub_status listener the
  # exporter above reads. conf.d/*.conf is auto-included by the image's http block.
  nginx:
    volumes:
      - ./nginx/stub-status.conf:/etc/nginx/conf.d/stub-status.conf:ro

  # mosquitto itself: unchanged except for the monitor credentials the entrypoint
  # turns into a read-only $SYS user (see mosquitto/entrypoint.sh).
  mosquitto:
    environment:
      MQTT_MONITOR_USERNAME: ${MQTT_MONITOR_USERNAME:-navfleet-monitor}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?MQTT_MONITOR_PASSWORD is required by the monitoring overlay (the broker no longer allows anonymous clients)}

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  # Prometheus + Grafana + backend, and nothing else. Not `internal: true`:
  # docker silently drops a published port on an internal network and Grafana
  # needs one. Nothing on this segment can address mongo or mosquitto anyway.
  monitoring:
