# Monitoring overlay: Prometheus + Grafana with provisioned datasource,
# dashboard and alert rules. Use alongside the base file:
#
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.monitoring.yml up -d
#
# An overlay rather than a compose `profiles:` entry, even though the roadmap
# said profile: compose interpolates the *whole* file before profiles are
# applied, so a required `GRAFANA_ADMIN_PASSWORD` on a profiled service breaks
# `up` for everyone who never asked for monitoring. Same opt-in, and the failure
# only lands on the deployment that opted in.
services:
  backend:
    networks:
      # Merged with the base list, so the backend can be scraped without giving
      # Prometheus any route to mongo or mosquitto.
      - monitoring

  prometheus:
    image: prom/prometheus:v3.1.0
    # Scrapes backend:3000/metrics from inside the network, which is exactly why
    # the edge nginx does not route /metrics at all.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    networks:
      - monitoring
    ports:
      # Loopback only: the query API is unauthenticated.
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    depends_on:
      - prometheus
    environment:
      # No anonymous access and no admin/admin: the password must be supplied,
      # the same rule the broker credentials follow.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required by the monitoring overlay}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    networks:
      - monitoring
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  # Prometheus + Grafana + backend, and nothing else. Not `internal: true`:
  # docker silently drops a published port on an internal network and Grafana
  # needs one. Nothing on this segment can address mongo or mosquitto anyway.
  monitoring:
