# Plain-HTTP edge (the default deployment). For TLS termination use the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# which mounts tls.conf over this file. Routes live in locations.conf so the two
# entry points cannot drift.

# Rate limit for the API surface: ~30 req/s per client IP with a small burst.
# The backend additionally rate-limits /api/auth (login brute-force) and the
# whole /api surface per IP; this is a coarser guard at the edge. Defined in the
# http context (conf.d/*.conf is included inside http).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Empty over plain HTTP, so `add_header Strict-Transport-Security $hsts` emits
# nothing here and a real value once the same routes are served over TLS.
map $scheme $hsts {
  https "max-age=31536000; includeSubDomains";
  default "";
}

server {
  # 8080, not 80: the unprivileged nginx image runs as uid 101 and cannot bind a
  # privileged port. The host mapping in docker-compose.yml keeps the published
  # port unchanged.
  listen 8080;
  server_name _;

  # Do not advertise the nginx version in responses or error pages.
  server_tokens off;

  include /etc/nginx/locations.conf;
}
