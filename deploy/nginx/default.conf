# Rate limit for the API surface: ~30 req/s per client IP with a small burst.
# The backend additionally rate-limits /api/auth (login brute-force); this is a
# coarser edge guard for the whole API. Defined in the http context (conf.d/*.conf
# is included inside http).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
  listen 80;
  server_name _;

  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://backend:3000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /scene-maps/ {
    proxy_pass http://backend:3000/scene-maps/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
    expires -1;
  }

  location / {
    proxy_pass http://frontend:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # Security response headers for the served SPA. The CSP is scoped to allow
    # the AMap SDK (script/style/img/tiles/websocket) the GPS map depends on;
    # tighten or widen the *.amap.com / *.autonavi.com hosts if the map breaks.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://webapi.amap.com https://*.amap.com; style-src 'self' 'unsafe-inline' https://*.amap.com; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' ws: wss: https://*.amap.com https://*.autonavi.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;
    # Enable HSTS only behind TLS (see the commented 443 server block below).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}

