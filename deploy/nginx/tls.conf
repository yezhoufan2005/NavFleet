# TLS edge, mounted over default.conf by docker-compose.tls.yml.
#
# Plain HTTP becomes a redirect and every route is served over TLS only, so a
# session cookie marked Secure (COOKIE_SECURE=true, which the overlay sets) is
# actually usable. Routes come from the same locations.conf the HTTP-only entry
# point uses.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

map $scheme $hsts {
  https "max-age=31536000; includeSubDomains";
  default "";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # $host, not a hardcoded name, so the same config works for an IP, a LAN name
  # and a real hostname. 308 rather than 301: it preserves the method and body,
  # so a redirected POST /api/auth/login does not silently become a GET.
  return 308 https://$host$request_uri;
}

server {
  # 8443 in-container for the same unprivileged-uid reason as 8080; the overlay
  # publishes host 443 onto it.
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # TLS 1.2 as the floor: 1.0/1.1 are deprecated and browsers have removed them.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:NavFleetTLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/locations.conf;
}
