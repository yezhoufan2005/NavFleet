# Mounted ONLY by docker-compose.monitoring.yml, into conf.d/ (auto-included by
# the image's http block). A separate internal listener so nginx-prometheus-exporter
# can read stub_status without it ever being reachable from the host: 8081 is not
# published, and the edge server on 8080 does not carry this location.
server {
  listen 8081;
  server_name _;
  server_tokens off;

  location = /stub_status {
    stub_status;
  }

  # Nothing else on this internal port.
  location / {
    return 404;
  }
}
