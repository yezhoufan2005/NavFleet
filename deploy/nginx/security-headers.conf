# Baseline security response headers, included by every location in locations.conf.
#
# nginx's `add_header` does NOT inherit into a location that declares its own, so a
# server-level set would silently vanish from exactly the locations that add anything
# (e.g. /scene-maps/ adds Cache-Control). Before this file only `location /` carried the
# full set — /api/, /health, /openapi.json, /docs, /ws and /scene-maps/ answered with none.
# Pulling the baseline into an include and adding it to every location closes that gap and
# makes "did this location ship its headers" a one-line, reviewable fact.
#
# The Content-Security-Policy is deliberately NOT here: the SPA needs an AMap-scoped policy
# (see `location /`), while a blanket one would break Swagger UI under /docs. This file is
# the transport/framing/referrer baseline that every response should carry regardless.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Powerful browser features this console never uses; deny them everywhere so an injected or
# proxied response cannot ask for them either. Device GPS is drawn from telemetry, not the
# browser's geolocation API, so `geolocation=()` is safe to deny.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# HSTS belongs on every response, not just the SPA's: $hsts is empty over plain HTTP (nginx
# then omits the header, as RFC 6797 requires) and carries max-age once served over TLS.
add_header Strict-Transport-Security $hsts always;
