# Shared routing table for the edge nginx, included by both the plain-HTTP
# server (default.conf) and the TLS server (tls.conf). Kept in one file so the
# two cannot drift: a route added for HTTP but forgotten for HTTPS is exactly
# the kind of difference nobody notices until production.
#
# Included *inside* a `server { }` block, so it must contain only
# server-context directives.

location /api/ {
  limit_req zone=api_limit burst=60 nodelay;
  proxy_pass http://backend:3000/api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /health {
  proxy_pass http://backend:3000/health;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

# /metrics is deliberately NOT proxied.
#
# An RFC1918 allowlist would be theatre here: on an internal LAN every client
# already has a private address, and a request arriving through docker's DNAT
# keeps its original source IP. The endpoint is unauthenticated, so the only
# real control is not routing it from outside — Prometheus scrapes
# `backend:3000/metrics` from inside the compose network instead.
#
# /openapi.json stays reachable but requires a session (the backend serves it
# behind the auth gate), so a scanner cannot enumerate the API.
location = /openapi.json {
  proxy_pass http://backend:3000/openapi.json;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Swagger UI, on the same terms as /openapi.json above: served by the backend
# behind the auth gate, with its assets vendored so the page pulls nothing from
# a CDN.
#
# This route was **documented and never routed**. `deployment.md` listed it
# alongside /openapi.json as an edge route while nothing here matched it, and
# after the v3 switch that failure stopped looking like one: web-history
# fallback means `/docs` returns 200 plus the console's own index.html, so the
# person who followed the doc got a page — the console's not-found view — rather
# than an error naming the problem.
#
# A prefix match, not `= /docs`: the page loads swagger-ui.css / -bundle.js and
# its own /docs/openapi.json from under this path.
location /docs {
  proxy_pass http://backend:3000/docs;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /ws {
  proxy_pass http://backend:3000/ws;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 3600s;
}

location /scene-maps/ {
  proxy_pass http://backend:3000/scene-maps/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  add_header Cache-Control "no-store" always;
  expires -1;
}

location / {
  proxy_pass http://web:8080/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;

  # The console image sets these three itself, so that it is also correct when
  # served without this proxy in front of it (a dev container, or a deployment
  # that terminates elsewhere). Hidden here rather than dropped there: without
  # this the client receives each one twice, and then neither place is the
  # authority — a later edit to one of them looks applied and is not.
  # Cache-Control is deliberately NOT hidden: the image sets `immutable` on
  # /assets/ and `no-store` on the entry document, and that split is finer than
  # anything this location could say, since /assets/ matches here too.
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;

  # Security response headers for the served SPA. The CSP is scoped to allow
  # the AMap SDK (script/style/img/tiles/websocket) the GPS map depends on;
  # tighten or widen the *.amap.com / *.autonavi.com hosts if the map breaks.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://webapi.amap.com https://*.amap.com; style-src 'self' 'unsafe-inline' https://*.amap.com; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' ws: wss: https://*.amap.com https://*.autonavi.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;

  # HSTS belongs here rather than at server level: an `add_header` inside a
  # location replaces every inherited one, so a server-level HSTS would silently
  # vanish from exactly the responses that serve the app. `$hsts` is empty over
  # plain HTTP (nginx then omits the header entirely), which is what RFC 6797
  # requires — an HSTS header must not be sent over a non-secure transport.
  add_header Strict-Transport-Security $hsts always;
}
