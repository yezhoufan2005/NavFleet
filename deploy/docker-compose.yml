# Container log rotation: cap each container's json-file logs so a long-running
# single host does not fill its disk. Applied to every service via *default-logging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    # Unprivileged variant: runs as uid 101 and listens on 8080 inside the
    # container, so nothing in the request path is root.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_HOST_PORT:-8080}:8080"
    networks:
      - edge
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_JS_CODE: ${VITE_AMAP_SECURITY_JS_CODE:-}
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      FLEET_NAME: ${FLEET_NAME:-智能车队}
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
      MQTT_USERNAME: ${MQTT_SUBSCRIBER_USERNAME:-navfleet-backend}
      MQTT_PASSWORD: ${MQTT_SUBSCRIBER_PASSWORD:?MQTT_SUBSCRIBER_PASSWORD is required (the broker no longer allows anonymous clients)}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-}
      MQTT_TOPIC_PATTERN: ${MQTT_TOPIC_PATTERN:-/fleet/{deviceId}/vehicle_info}
      MONGO_URI: ${MONGO_URI:-mongodb://root:example@mongo:27017/fleet_monitor?authSource=admin}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-fleet_monitor}
      SEED_FILE: ${SEED_FILE:-}
      OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-60}
      TELEMETRY_RETENTION_SECONDS: ${TELEMETRY_RETENTION_SECONDS:-2592000}
      ALERTS_RETENTION_SECONDS: ${ALERTS_RETENTION_SECONDS:-15552000}
      MAX_HISTORY_POINTS: ${MAX_HISTORY_POINTS:-500}
      MONGO_BUFFER_LIMIT: ${MONGO_BUFFER_LIMIT:-2000}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DEBUG_INGEST_ENABLED: ${DEBUG_INGEST_ENABLED:-false}
      # One nginx hop in front; see deploy/.env.example.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-50}
      CONFIG_ROOT_PATH: ${CONFIG_ROOT_PATH:-/runtime-config}
      CONFIG_WATCH_USE_POLLING: ${CONFIG_WATCH_USE_POLLING:-false}
      CONFIG_WATCH_DEBOUNCE_MS: ${CONFIG_WATCH_DEBOUNCE_MS:-1000}
    networks:
      - edge
      - data
      - bus
    volumes:
      - type: bind
        source: ${CONFIG_RUNTIME_HOST_PATH:-../config-runtime}
        target: /runtime-config
        read_only: true
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    # Loopback-only: the demo publisher (`npm run mock:mqtt`) runs on the host
    # and needs 1883, but nothing on the LAN should reach the broker. Delete this
    # mapping entirely for a deployment where publishers are remote vehicles —
    # the backend reaches the broker over the `bus` network, not the host.
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    networks:
      - bus
    environment:
      MQTT_SUBSCRIBER_USERNAME: ${MQTT_SUBSCRIBER_USERNAME:-navfleet-backend}
      MQTT_SUBSCRIBER_PASSWORD: ${MQTT_SUBSCRIBER_PASSWORD:?MQTT_SUBSCRIBER_PASSWORD is required (the broker no longer allows anonymous clients)}
      MQTT_PUBLISHER_USERNAME: ${MQTT_PUBLISHER_USERNAME:-navfleet-publisher}
      MQTT_PUBLISHER_PASSWORD: ${MQTT_PUBLISHER_PASSWORD:?MQTT_PUBLISHER_PASSWORD is required (the broker no longer allows anonymous clients)}
      MQTT_ACL_TOPIC_PATTERN: ${MQTT_ACL_TOPIC_PATTERN:-/fleet/#}
    entrypoint: ["/bin/sh", "/mosquitto/entrypoint.sh"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - mosquitto-auth:/mosquitto/auth
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[m]osquitto'"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all", "--auth"]
    networks:
      - data
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_INITDB_ROOT_USERNAME:-root}",
          "-p",
          "${MONGO_INITDB_ROOT_PASSWORD:-example}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
    restart: unless-stopped

volumes:
  mongo-data:
  mosquitto-auth:
  mosquitto-data:
  mosquitto-log:

# Three segments instead of one flat default network, so a compromise of the web
# tier does not hand over the database and the broker:
#   edge — nginx <-> frontend <-> backend (the only segment with a host port)
#   data — backend <-> mongo
#   bus  — backend <-> mosquitto
# The backend is the only service on all three; nothing on `edge` can address
# mongo or mosquitto at all.
#
# `data` is also `internal: true`, which denies mongo any outbound access. `bus`
# is not: docker silently drops a published port on an internal network, and the
# documented local demo publishes to 127.0.0.1:1883 from the host. A deployment
# whose publishers are all remote vehicles should delete mosquitto's `ports`
# entry and add `internal: true` here too.
networks:
  edge:
  data:
    internal: true
  bus:
