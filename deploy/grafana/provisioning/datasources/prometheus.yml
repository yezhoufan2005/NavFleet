apiVersion: 1

# Provisioned, not clicked in by hand: a datasource created through the UI lives
# only in that container's volume, so the dashboards would arrive broken on any
# fresh deployment.
datasources:
  - name: Prometheus
    uid: navfleet-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # Ties the two together, so Grafana's alerting view can show what
      # Alertmanager currently holds instead of only what Prometheus is
      # evaluating. Without it an operator has to know that a second UI exists on
      # a different port.
      manageAlerts: false
      alertmanagerUid: navfleet-alertmanager

  - name: Alertmanager
    uid: navfleet-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      # Prometheus's own Alertmanager, not Grafana's built-in ruler: the rules
      # live in `deploy/prometheus/alerts.yml` and are version-controlled, which
      # is the point — rules clicked into Grafana exist only in its volume.
      implementation: prometheus
      handleGrafanaManagedAlerts: false
