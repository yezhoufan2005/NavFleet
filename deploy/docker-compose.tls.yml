# TLS overlay. Use alongside the base file:
#
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml up -d
#
# Provide certificates in deploy/nginx/certs/ as fullchain.pem + privkey.pem
# (deploy/tools/generate-dev-certs.sh makes a self-signed pair for a lab).
# The directory is gitignored — private keys must never be committed.
services:
  nginx:
    ports:
      # Host 443 -> 8443 in-container (the unprivileged image cannot bind 443
      # itself). The base file's HTTP mapping stays and now serves the redirect,
      # so set HTTP_HOST_PORT=80 for the classic 80 -> 443 hop.
      - "${HTTPS_HOST_PORT:-443}:8443"
    environment:
      # The redirect has to name the published HTTPS port; nginx only sees 8443. The
      # entrypoint renders tls.conf with it, and only it.
      HTTPS_HOST_PORT: ${HTTPS_HOST_PORT:-443}
      NGINX_ENVSUBST_FILTER: ^HTTPS_HOST_PORT$
    volumes:
      # Merged by container path: the plain-HTTP entry point is replaced by an empty
      # one, and the redirect + TLS server is rendered from the template.
      - ./nginx/tls-default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls.conf:/etc/nginx/templates/tls.conf.template:ro
      # nginx runs as uid 101: on Linux the key must be readable by it through the
      # bind mount (generate-dev-certs.sh sets that up for its own pair).
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      # The HTTP listener now answers 308, so probe the TLS listener instead.
      # --no-check-certificate: a self-signed lab cert must not fail the probe,
      # and the probe is a loopback connection inside the container anyway.
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null --no-check-certificate https://127.0.0.1:8443/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    environment:
      # Hardcoded, not ${COOKIE_SECURE:-true}: every route is TLS-only under this
      # overlay, so there is no case where the session cookie should lack Secure.
      # Leaving it env-overridable meant a stale COOKIE_SECURE=false in .env
      # silently won, and the operator believed they were covered.
      COOKIE_SECURE: "true"
