# Prometheus scrape config for the NavFleet stack.
#
# The backend is scraped in-network at backend:3000/metrics. That endpoint is
# unauthenticated and, since Phase 9C, deliberately NOT routed by the edge nginx
# — this file is the reason it does not need to be.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: navfleet

rule_files:
  - /etc/prometheus/alerts.yml

# Where the rules in `alerts.yml` actually go. Without this block Prometheus
# evaluates all 13 of them and then has nowhere to send the ones that fire — which
# is precisely how this stack shipped until the Alertmanager service was added to
# `docker-compose.monitoring.yml`. The rules were visible on Prometheus's own
# /alerts page and reached no one.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: navfleet-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]
        labels:
          service: backend

  # Container-side exporters (docker-compose.monitoring.yml). These targets only
  # exist when that overlay is up; on a plain monitoring stack without the exporters
  # they simply show as `up == 0`, which is what the NavFleet*ExporterDown rules key
  # off. Each covers a blind spot the backend cannot report on itself.
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          service: mongo
  - job_name: mosquitto
    static_configs:
      - targets: ["mosquitto-exporter:9234"]
        labels:
          service: mosquitto
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx

  # Prometheus scraping itself: cheap, and it makes "is the monitoring stack
  # actually running" answerable from inside Grafana.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
