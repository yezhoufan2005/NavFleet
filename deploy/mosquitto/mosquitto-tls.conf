# TLS-enabled broker config, mounted over mosquitto.conf by
# docker-compose.mqtt-tls.yml. Same auth model as the plaintext config
# (entrypoint.sh still generates passwd/acl from the environment) — the only
# addition is a second, TLS listener.
#
# Two listeners on purpose:
#   1883 — kept for the loopback demo publisher (`npm run mock:mqtt`), which runs
#          on the host and is only reachable via mosquitto's 127.0.0.1 port map.
#   8883 — TLS, what the backend connects to over the `bus` network (mqtts://).
# A deployment whose publishers are all remote vehicles should drop the 1883
# listener here and mosquitto's host port map, so nothing plaintext is exposed.
#
# `per_listener_settings` stays at its default (false): the password/ACL files are
# global and apply to both listeners, so TLS does not weaken or bypass auth.
listener 1883 0.0.0.0

listener 8883 0.0.0.0
# Server-side TLS material, provided by deploy/tools/generate-mqtt-certs.sh (lab)
# or your own CA. The directory is bind-mounted read-only and gitignored — keys
# never enter the repo.
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# The backend authenticates with username/password over the encrypted channel; it
# does not present a client certificate. Mutual TLS is a separate decision and
# would need certs issued to every publisher too.
require_certificate false

allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
