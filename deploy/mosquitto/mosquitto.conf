# Authenticated broker. Anonymous access is off: with it on, anything that can
# reach 1883 could publish fabricated telemetry into the live fleet, or subscribe
# to every vehicle's position.
#
# The password and ACL files are generated at container start from the
# MQTT_*_USERNAME / MQTT_*_PASSWORD environment variables (see entrypoint.sh) so
# no credential is ever committed. They live under /mosquitto/auth, a writable
# volume, because /mosquitto/config carries read-only bind mounts.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
