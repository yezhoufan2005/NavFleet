name: 功能/改进建议
description: 提议一个新功能或改进
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前的痛点或缺口是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为 / 大致实现思路
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围确认
      description: 是否仍在「只读监控」范围内（无控制下发 / 多租户）？
    validations:
      required: false
