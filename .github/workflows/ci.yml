name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Monorepo (npm workspaces): a single root lockfile drives one install per job,
# then each job runs its workspace's gates via `-w`, across a Node version matrix.
jobs:
  backend:
    name: Backend + shared (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @navfleet/shared
      - run: npm run lint -w navfleet-backend
      - run: npm run format:check -w navfleet-backend
      - run: npm run typecheck -w navfleet-backend
      - run: npm run test:coverage -w navfleet-backend
      - run: npm run build -w navfleet-backend
      - if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint -w navfleet-frontend
      - run: npm run format:check -w navfleet-frontend
      - run: npm run typecheck -w navfleet-frontend
      - run: npm run test:coverage -w navfleet-frontend
      - run: npm run build -w navfleet-frontend
      - if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (playwright, node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright starts the backend and the vite dev server itself; the run
      # needs neither MongoDB nor an MQTT broker (see e2e/support/harness.ts).
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
