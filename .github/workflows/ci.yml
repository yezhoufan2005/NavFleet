name: CI

# `push` is limited to main so a branch is validated once — by its pull request —
# instead of twice. Every change in this repo goes through a PR, and main is still
# checked on the merge commit. Before this, one commit on a branch ran the whole
# matrix twice, concurrently: on 2026-08-29 that produced a red E2E and a green
# E2E for the same tree, which was useful by accident but paid for on every push.
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, so an intermittent failure can be sampled on purpose instead
  # of by pushing empty commits — which is what the duplicate runs were doing for
  # us by accident.
  workflow_dispatch:

# Supersede a PR's in-flight run when new commits land on it. Runs on main are
# never cancelled: each one records whether a specific merge commit is good, so
# losing it would leave a gap in that record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Monorepo (npm workspaces): a single root lockfile drives one install per job,
# then each job runs its workspace's gates via `-w`, across a Node version matrix.
#
# The matrix is **22 and 24**, and dropping 20 was overdue rather than a concession to a
# dependency that demanded it: Node 20 reached end-of-life on 2026-04-30, so from that day
# the lower half of this matrix was proving compatibility with a runtime that no longer
# receives security patches — and `engines: >=20` was inviting people to run one. 22 is the
# floor (what `engines` now says) and 24 is the current active LTS, so the pair brackets
# what is actually supported. Artifacts come off the **floor** of the matrix, which is why
# the `if:` conditions below name 22 rather than the lowest number that used to be here.
jobs:
  # 部署接线：CI 此前完全不看 `deploy/`，而 14J 引入了几条**跨文件**约束 —— nginx 的上游必须是
  # compose 里存在的服务、回滚 overlay 必须复用同一个服务名（否则回滚会同时拉起两套）、
  # publish-images 的 dockerfile 必须存在。每个文件单看都合法，只有放在一起才知道对不对。
  #
  # 纯静态、不需要 Docker，所以是最快的那个 job（约 10 秒）。需要真起栈的那一层在
  # scripts/verify-stack.sh，不进 CI —— 它要 5 个容器。
  deploy-wiring:
    name: Deploy wiring (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/check-deploy-wiring.mjs

  backend:
    name: Backend + shared (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @navfleet/shared
      - run: npm run lint -w navfleet-backend
      - run: npm run format:check -w navfleet-backend
      - run: npm run typecheck -w navfleet-backend
      - run: npm run test:coverage -w navfleet-backend
      - run: npm run build -w navfleet-backend
      - if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # The v1.0.0 frontend is **frozen**: it is no longer deployed (the `web` service
  # builds the console), no further work goes into it, and it is kept in the repo
  # for one reason — if the v3 console disappoints, it can be put back without
  # being rewritten (deploy/docker-compose.legacy-frontend.yml).
  #
  # So this job's question is narrow: *does the frozen code still work against the
  # packages that keep moving?* `@navfleet/shared` and `@navfleet/fleet-core` are
  # shared, so a change in either can break it without a single file under
  # `frontend/` changing.
  #
  # The one gate deliberately dropped is the **coverage threshold** — `test`, not
  # `test:coverage`. It is the only gate here that can go red without anyone
  # touching anything relevant: a fleet-core refactor changes which branches the
  # frontend's tests reach, the ratchet trips, and the only fix is editing tests in
  # a workspace whose whole value is being left alone. It is also one of the four
  # thresholds blocking the vitest 5 upgrade, so dropping it leaves three.
  #
  # lint / format:check / typecheck stay: on unchanged code they are deterministic,
  # they cost seconds, and keeping them means the root `npm run lint` (which uses
  # `--workspaces`) and this job cannot disagree. If a future eslint or prettier
  # major flags the frozen sources, the answer is to ignore this workspace at that
  # point, with the actual errors in hand — not to pre-emptively stop looking.
  frontend:
    name: Frontend v1.0.0, frozen (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint -w navfleet-frontend
      - run: npm run format:check -w navfleet-frontend
      - run: npm run typecheck -w navfleet-frontend
      - run: npm run test -w navfleet-frontend
      - run: npm run build -w navfleet-frontend

  console:
    name: Console v3, deployed (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `@navfleet/fleet-core` is the shared logic layer, and its gates run here —
      # with the console — rather than with the frozen frontend: this is the
      # workspace that keeps developing against it, so this is where breaking it
      # should show up. (Same reason `@navfleet/shared`'s gates run in the backend
      # job: finding out in the same run is cheaper than a second one.)
      - run: npm run lint -w @navfleet/fleet-core
      - run: npm run format:check -w @navfleet/fleet-core
      - run: npm run typecheck -w @navfleet/fleet-core
      - run: npm run test:coverage -w @navfleet/fleet-core
      # A separate job from `frontend` rather than extra steps in it. The original
      # reason was that the two consoles were independent deliverables through
      # Phase 12-13; after the switch the reason inverts but still holds — this is
      # now the deployed half, and it should not go red because the frozen one did.
      - run: npm run lint -w navfleet-console
      - run: npm run format:check -w navfleet-console
      - run: npm run typecheck -w navfleet-console
      # The map's grid and scale bar are drawn on `ros-canvas`, which is not a
      # semantic surface token — so they are outside the preview page's 4.5:1 text
      # audit and need their own gate. A check nobody runs is not a gate: this one
      # already caught both a wrong estimate and a light/dark inconsistency.
      - run: npm run check:map-contrast
      - run: npm run test:coverage -w navfleet-console
      - run: npm run build -w navfleet-console
      - if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: console-coverage
          path: frontend-next/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (playwright, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `e2e/` is the only source tree outside the npm workspaces, so the
      # per-workspace gates in the other jobs never see it. Without these two
      # steps its lint and type errors reach main unchallenged.
      - run: npm run lint:e2e
      - run: npm run typecheck:e2e
      # Playwright starts the backend and both vite dev servers itself; the run
      # needs neither MongoDB nor an MQTT broker (see e2e/support/harness.ts).
      # Two browser projects share one seeded fleet: `console` is the deployed v3
      # one, `frontend` is the frozen v1.0.0 one kept as the rollback. The latter's
      # specs run here rather than in its own job because they are the only proof
      # the frozen code still *runs* — and unlike lint or coverage, they never ask
      # it to change.
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
