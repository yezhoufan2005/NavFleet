name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Monorepo (npm workspaces): a single root lockfile drives one install per job,
# then each job runs its workspace's gates via `-w`.
jobs:
  backend:
    name: Backend + shared (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @navfleet/shared
      - run: npm run lint -w navfleet-backend
      - run: npm run format:check -w navfleet-backend
      - run: npm run typecheck -w navfleet-backend
      - run: npm test -w navfleet-backend
      - run: npm run build -w navfleet-backend

  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint -w navfleet-frontend
      - run: npm run format:check -w navfleet-frontend
      - run: npm run typecheck -w navfleet-frontend
      - run: npm test -w navfleet-frontend
      - run: npm run build -w navfleet-frontend
