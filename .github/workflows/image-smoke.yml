name: Image build smoke

# The release image build (publish-images.yml) only runs at release time, from a
# workflow_call — so a Dockerfile change that breaks the (emulated) arm64 build would
# not surface until a release depended on it. This runs the same multi-arch build
# **build-only, no push** on any PR that touches a Dockerfile or the image workflows,
# so arm64 breakage is caught on that PR instead of at release.
#
# Path-scoped on purpose: an emulated arm64 build is minutes long, so it must not run
# on ordinary PRs — only when the thing it validates actually changes.
on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/image-smoke.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }}, arm64, no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: console
            dockerfile: frontend-next/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # arm64 only: amd64 is already exercised by every other build in CI. This proves the
      # new architecture builds; publish-images.yml builds both and pushes at release time.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
