name: Publish images

# Builds and pushes the backend + console images to GHCR for a released tag.
# Both images build from the repo root context (npm workspaces monorepo).
#
# Called by release-please.yml when a release is created, and available manually.
# It is deliberately NOT triggered by `on: release: [published]` any more: that
# never once fired. release-please creates the Release with GITHUB_TOKEN, and
# GitHub does not let events raised by GITHUB_TOKEN start other workflows (loop
# prevention) — so three releases shipped with the workflow sitting at zero runs
# while the docs claimed images were published. A `workflow_call` from the job
# that cuts the release is an explicit invocation, and is not suppressed.
#
# CHECKING WHETHER IT RAN: look at the *release-please* workflow run for that
# release and find its `images / images (…)` jobs. A `workflow_call` run is
# attributed to the CALLING workflow, so this file's own run list stays almost
# empty — it shows only manual dispatches. Reading that list as "the images never
# published" is a mistake that is very easy to make twice, given the history above.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.0.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.0.0
        type: string
        required: true

permissions:
  contents: read
  packages: write
  # Keyless cosign signing exchanges this workflow's OIDC token with Fulcio for a
  # short-lived signing certificate — no long-lived key is stored anywhere. Without
  # `id-token: write` the token is never minted and `cosign sign` cannot run.
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          # The console, not `frontend/Dockerfile`: since the Phase 14 switch
          # this is the image compose deploys. Publishing the retiring one as
          # `navfleet-frontend:1.1.0` (and `:latest`) would put a lie in the
          # registry — the tag would claim to be that release's UI and contain
          # the previous one. `navfleet-frontend` therefore stops at 1.0.x,
          # which is exactly what it holds. The rollback overlay builds the old
          # image locally from source and never pulls it.
          - name: console
            dockerfile: frontend-next/Dockerfile
    steps:
      # The tag, not the default branch: this workflow now runs from the release
      # job on main, so without an explicit ref it would build main's tip and
      # label it with the release version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # QEMU is what lets the amd64 runner emulate arm64 for the second platform below.
      # The node/nginx base images are already multi-arch, and the builds are plain JS (no
      # native compilation beyond esbuild/rollup, which ship arm64-musl prebuilds), so the
      # emulated arm64 build is slower but not fragile.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/navfleet-${{ matrix.name }}
          # `value:` supplies the version explicitly. The semver types normally
          # read it from `github.ref`, which is `refs/heads/main` here and would
          # yield no tags at all.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # amd64 as before, plus arm64 for Apple-silicon / Graviton hosts. buildx pushes a
          # single multi-arch image index; `docker pull` picks the right one per host.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM + provenance attestation is generated per platform and attached to the image
          # in GHCR (buildx / OCI referrers). It answers "what is inside this image" for a supply
          # -chain audit without unpacking it. The index itself is signed below (cosign keyless).
          sbom: true
          provenance: mode=max
          # AMap key is a build-time (Vite) value; the console image works
          # without it (the GPS panel shows a config notice instead of a map).
          # Provide repo secrets to bake one in.
          build-args: |
            VITE_AMAP_KEY=${{ secrets.VITE_AMAP_KEY }}
            VITE_AMAP_SECURITY_JS_CODE=${{ secrets.VITE_AMAP_SECURITY_JS_CODE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signing: no COSIGN_PRIVATE_KEY, no secret to provision or rotate.
      # cosign trades this run's GitHub OIDC token for a short-lived Fulcio cert,
      # signs, and records the signature in the public Rekor transparency log. The
      # signer identity that a verifier pins is therefore the workflow itself
      # (`.github/workflows/publish-images.yml@<ref>`) + the Actions OIDC issuer,
      # not a key that could leak — which is exactly why the earlier "signing
      # deferred until a key is provisioned" note is now obsolete.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign the image *index* by digest, not by tag. buildx pushed one multi-arch
      # index; signing its digest covers both platforms and cannot race a tag that
      # a later run moves. `${{ steps.build.outputs.digest }}` is that index digest.
      # The image ref is spelled exactly like metadata-action's `images:` input so
      # the two cannot drift.
      - name: Sign image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/navfleet-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
