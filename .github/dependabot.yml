version: 2
updates:
  # Root npm workspaces (backend, frontend, frontend-next, packages/*) — one lockfile at "/".
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:07"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      # ── Co-versioned toolchains, majors included ──────────────────────────────
      # These come first because a package lands in the *first* group it matches,
      # and the broad `dependency-type` groups below would otherwise scatter them.
      #
      # The reason they are grouped at all is that a PR bumping one of them alone
      # cannot go green, so dependabot was opening pull requests that were red by
      # construction and reopening them every Monday:
      #
      # - #107 bumped `@vitest/coverage-v8` to 4 while `vitest` stayed at 3. The
      #   peer dependency is exact, so 6 of 8 CI jobs failed — not a test to fix,
      #   a dependency tree that does not resolve.
      # - #110 (eslint 10) failed on both frontends, and #108 (eslint-plugin-vue 10)
      #   failed on the console. Neither passes alone: eslint 10 needs plugin-vue 10,
      #   and plugin-vue 10 does not work under eslint 9.
      #
      # Grouped, dependabot opens one PR that at least *can* pass. It will still
      # need flat-config work for the eslint jump — but a reviewable PR beats two
      # permanently red ones.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      eslint:
        patterns:
          - eslint
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "@eslint/*"
          - typescript-eslint
      # ── Everything else, minor and patch only ────────────────────────────────
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions workflow pins.
  #
  # One group for all of them: five separate PRs a week for version strings is
  # noise, and the risk profile is uniform. Worth knowing when reviewing them —
  # a green CI run does **not** validate the `docker/*` bumps, because
  # `publish-images.yml` is `workflow_call` / `workflow_dispatch` only and does not
  # run on pull requests. Only `actions/*` used by `ci.yml` are actually exercised.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:07"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # Base images: node / nginx-unprivileged in the two deployed images' Dockerfiles, and mongo,
  # mosquitto, mailpit and the monitoring stack pinned in deploy/*.yml. Without these entries a
  # security release of any of them reached nobody. frontend/Dockerfile is the frozen v1.0.0
  # rollback image and is left out on purpose. Grouped per ecosystem, one PR a week each.
  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/frontend-next"
    # Node majors are a decision, not a bump: the images run an LTS line the CI matrix and
    # `engines` name (22 / 24, then 26), and an odd major (25) is never LTS — `engines`
    # excludes it outright. A move to the next LTS comes with the matrix change, by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "09:07"
      timezone: Asia/Shanghai
    groups:
      base-images:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: "/deploy"
    # mongo stays on 7.0 on purpose (deployment.md 3.1: 8.0 and later do not start on a whole
    # range of current kernels), and a major cannot be skipped anyway — 7.0 data needs 8.0 to
    # upgrade through. Patch releases of the pinned line still arrive.
    ignore:
      - dependency-name: mongo
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "09:07"
      timezone: Asia/Shanghai
    groups:
      compose-images:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
