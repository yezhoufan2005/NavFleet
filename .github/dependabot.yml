version: 2
updates:
  # Root npm workspaces (backend, frontend, packages/*) — one lockfile at "/".
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:07"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions workflow pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:07"
      timezone: Asia/Shanghai
    commit-message:
      prefix: ci
