<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The product's own mark, supplied by the owner during 14A acceptance. It is the
      same file the top bar renders (`AppTopBar.vue`), so the tab icon and the icon
      beside the product name cannot drift apart.

      Declaring it also stops the browser asking for /favicon.ico, which a strict test
      run counts as a failed request rather than as the browser being thorough.
    -->
    <link rel="icon" type="image/png" href="/image.png" />
    <title>智能车队监控平台</title>
    <script>
      // Stamp the stored theme before the first paint. The v1.0.0 frontend writes
      // data-theme from useTheme() during App setup, which means a viewer whose
      // saved preference is dark sees a flash of the light baseline first. Doing it
      // inline is the only way to be ahead of the initial render.
      try {
        var saved = localStorage.getItem("navfleet:theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (error) {
        // Private mode or a blocked storage partition — fall through to the
        // prefers-color-scheme default, which is a correct answer too.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
