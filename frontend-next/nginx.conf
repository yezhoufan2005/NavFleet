# SPA config for the console image.
#
# The v1.0.0 frontend ships no nginx conf at all — it uses hash routing, so the
# base image's default site is enough. This console uses web history (an 11C
# decision, taken for the alert deep links Phase 16D needs and for putting filter
# state in the URL), which means any path other than `/` has to be answered with
# index.html or a refresh on `/devices/agv-01` returns 404.
#
# The security headers are repeated here rather than left to the edge because
# nginx's `add_header` does not inherit into a location that sets its own — the
# same reason `deploy/nginx/locations.conf` carries them inside `location /`. An
# image that is correct on its own also means the console can be served without
# the edge proxy in front of it during development.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; the entry document must never be cached, or a
    # deploy leaves clients on the previous bundle until they hard-reload.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
